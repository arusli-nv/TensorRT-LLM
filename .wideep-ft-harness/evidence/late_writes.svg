<text x="220" y="233" font-size="13" fill="#c62828" text-anchor="start" font-weight="bold">Dead rank 2&#x27;s in-flight write, aimed at row 8 in step n, lands in rank 4&#x27;s row in step n+1: it corrupts a survivor&#x27;s data.</text>
<text x="220" y="348" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="bold">Rank 2&#x27;s region (hatched) is never reassigned or read after it dies: its late writes stay there.</text>
<text x="20" y="400" font-size="16" fill="#222" text-anchor="start" font-weight="bold">Everything source k writes into a peer&#x27;s workspace</text>
<rect x="20" y="418" width="1200" height="32" fill="#eceff1" stroke="#ddd"/>
<text x="30" y="439" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Written by source k</text>
<text x="330" y="439" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Location in the peer</text>
<text x="780" y="439" font-size="13" fill="#222" text-anchor="start" font-weight="bold">After rank k is lost</text>
<rect x="20" y="450" width="1200" height="32" fill="#fafafa" stroke="#ddd"/>
<text x="30" y="471" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Dispatch payloads</text>
<text x="330" y="471" font-size="13" fill="#222" text-anchor="start" font-weight="normal">fixed region k: [source][payload][max_num_tokens_per_rank]</text>
<text x="780" y="471" font-size="13" fill="#222" text-anchor="start" font-weight="normal">gather skips masked sources; region never reassigned</text>
<rect x="20" y="482" width="1200" height="32" fill="white" stroke="#ddd"/>
<text x="30" y="503" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Dispatch / combine completion flags</text>
<text x="330" y="503" font-size="13" fill="#222" text-anchor="start" font-weight="normal">word k of each flag array</text>
<text x="780" y="503" font-size="13" fill="#222" text-anchor="start" font-weight="normal">masked sources are never waited on</text>
<rect x="20" y="514" width="1200" height="32" fill="#fafafa" stroke="#ddd"/>
<text x="30" y="535" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Receive counters (two parities)</text>
<text x="330" y="535" font-size="13" fill="#222" text-anchor="start" font-weight="normal">word k of each parity</text>
<text x="780" y="535" font-size="13" fill="#222" text-anchor="start" font-weight="normal">not read for masked sources</text>
<rect x="20" y="546" width="1200" height="32" fill="white" stroke="#ddd"/>
<text x="30" y="567" font-size="13" fill="#222" text-anchor="start" font-weight="normal">EPLB gathered statistics</text>
<text x="330" y="567" font-size="13" fill="#222" text-anchor="start" font-weight="normal">row k</text>
<text x="780" y="567" font-size="13" fill="#222" text-anchor="start" font-weight="normal">ignored for masked sources</text>
<rect x="20" y="578" width="1200" height="32" fill="#fafafa" stroke="#ddd"/>
<text x="30" y="599" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Combine outputs</text>
<text x="330" y="599" font-size="13" fill="#222" text-anchor="start" font-weight="normal">none: combine pulls from peers</text>
<text x="780" y="599" font-size="13" fill="#222" text-anchor="start" font-weight="normal">—</text>
<text x="20" y="640" font-size="13" fill="#333" text-anchor="start" font-weight="normal">Backing memory stays valid: bound workspaces stay mapped until model teardown, so late writes never hit freed or reused memory.</text>
<text x="20" y="662" font-size="13" fill="#333" text-anchor="start" font-weight="normal">Gather kernel (new): packs valid rows of the fixed regions into the dense input the expert GEMMs expect; masked or aborted rows become expert id -1 with zero data.</text>
</svg>