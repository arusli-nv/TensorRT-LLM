<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" font-family="sans-serif" font-size="13">
<rect width="100%" height="100%" fill="white"/>
<text x="10" y="24" font-size="16" font-weight="bold">Time from killing one GPU worker process until… (DeepSeek-R1 on 32 GPUs; log scale)</text>
<line x1="300" y1="44" x2="300" y2="158" stroke="#ddd"/>
<text x="300" y="172" text-anchor="middle" fill="#666">0.1 s</text>
<line x1="461" y1="44" x2="461" y2="158" stroke="#ddd"/>
<text x="461" y="172" text-anchor="middle" fill="#666">1 s</text>
<line x1="622" y1="44" x2="622" y2="158" stroke="#ddd"/>
<text x="622" y="172" text-anchor="middle" fill="#666">10 s</text>
<line x1="783" y1="44" x2="783" y2="158" stroke="#ddd"/>
<text x="783" y="172" text-anchor="middle" fill="#666">100 s</text>
<text x="292" y="62" text-anchor="end">With FT: serving new requests</text>
<rect x="300" y="44" width="86" height="26" fill="#2e7d32" opacity="0.35"/>
<rect x="300" y="44" width="33" height="26" fill="#2e7d32"/>
<text x="392" y="62">0.16 to 0.34 s</text>
<text x="292" y="100" text-anchor="end">With FT: in-flight requests finished</text>
<rect x="300" y="82" width="242" height="26" fill="#66bb6a" opacity="0.35"/>
<rect x="300" y="82" width="145" height="26" fill="#66bb6a"/>
<text x="548" y="100">0.8 to 3.2 s</text>
<text x="292" y="138" text-anchor="end">Without FT: restart (load + warmup only)</text>
<rect x="300" y="120" width="521" height="26" fill="#c62828" opacity="0.35"/>
<rect x="300" y="120" width="468" height="26" fill="#c62828"/>
<text x="827" y="138">81 to 173 s</text>
<text x="10" y="234" font-size="16" font-weight="bold">Generation throughput (output tokens per second)</text>
<text x="292" y="268" text-anchor="end">FT off, 32 GPUs</text>
<rect x="300" y="250" width="441" height="26" fill="#9e9e9e"/>
<text x="747" y="268">14,689</text>
<text x="292" y="306" text-anchor="end">FT on, 32 GPUs</text>
<rect x="300" y="288" width="435" height="26" fill="#1565c0"/>
<text x="741" y="306">14,488</text>
<text x="292" y="344" text-anchor="end">FT on, 31 GPUs after losing one</text>
<rect x="300" y="326" width="419" height="26" fill="#42a5f5"/>
<text x="725" y="344">13,960</text>
<text x="10" y="380" fill="#666">FT = fault tolerance. Without FT the job must also be torn down and rescheduled before the restart, and all in-flight requests are lost.</text>
</svg>