<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="28" font-size="16" font-weight="bold">Time from a rank loss until new requests are served</text>
<text x="20" y="46" fill="#666" font-size="12">log scale; without FT: model load and warmup only, before teardown and rescheduling</text>
<line x1="250" y1="58" x2="250" y2="128" stroke="#e0e0e0"/>
<text x="250" y="144" text-anchor="middle" fill="#888" font-size="12">0.1 s</text>
<line x1="382" y1="58" x2="382" y2="128" stroke="#e0e0e0"/>
<text x="382" y="144" text-anchor="middle" fill="#888" font-size="12">1 s</text>
<line x1="515" y1="58" x2="515" y2="128" stroke="#e0e0e0"/>
<text x="515" y="144" text-anchor="middle" fill="#888" font-size="12">10 s</text>
<line x1="647" y1="58" x2="647" y2="128" stroke="#e0e0e0"/>
<text x="647" y="144" text-anchor="middle" fill="#888" font-size="12">100 s</text>
<text x="240" y="81" text-anchor="end">With fault tolerance</text>
<rect x="250" y="64" width="70" height="24" rx="3" fill="#2e7d32"/>
<text x="328" y="81" font-weight="bold">0.16 – 0.34 s</text>
<text x="240" y="115" text-anchor="end">Without (restart)</text>
<rect x="250" y="98" width="428" height="24" rx="3" fill="#c62828"/>
<text x="686" y="115" font-weight="bold">81 – 173 s</text>
<text x="20" y="186" font-size="16" font-weight="bold">Generation throughput (output tokens/s), 64 requests per GPU</text>
<text x="20" y="204" fill="#666" font-size="12">medians of three runs; the last bar uses the overlap scheduler and MTP, which FT does not support yet</text>
<text x="240" y="233" text-anchor="end">FT off, 32 GPUs</text>
<rect x="250" y="216" width="190" height="24" rx="3" fill="#9e9e9e"/>
<text x="448" y="233" font-weight="bold">82.7k</text>
<text x="240" y="267" text-anchor="end">FT on, 32 GPUs</text>
<rect x="250" y="250" width="183" height="24" rx="3" fill="#1565c0"/>
<text x="441" y="267" font-weight="bold">79.6k  (−3.7%)</text>
<text x="240" y="301" text-anchor="end">FT on, 31 GPUs after a loss</text>
<rect x="250" y="284" width="174" height="24" rx="3" fill="#64b5f6"/>
<text x="432" y="301" font-weight="bold">75.8k  (98% per GPU)</text>
<text x="240" y="335" text-anchor="end">Production config, FT off</text>
<rect x="250" y="318" width="362" height="24" rx="3" fill="#616161"/>
<text x="620" y="335" font-weight="bold">157.2k</text>
</svg>