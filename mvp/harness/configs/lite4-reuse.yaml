# lite4-sync.yaml with KV block reuse and chunked prefill (max_num_tokens 128, so ~400-token prompts span 4 chunks):
# FT with prefix caching (UPDATES 2026-10-18 item 2).
tensor_parallel_size: 4
moe_expert_parallel_size: 4
moe_tensor_parallel_size: 1
enable_attention_dp: true
enable_lm_head_tp_in_adp: false
gpus_per_node: 4
disable_overlap_scheduler: true
enable_autotuner: false
max_batch_size: 64
max_num_tokens: 128
enable_chunked_prefill: true
max_seq_len: 2304
cuda_graph_config:
  batch_sizes:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  enable_padding: true
kv_cache_config:
  enable_block_reuse: true
  free_gpu_memory_fraction: 0.5
moe_config:
  backend: CUTEDSL
  disable_finalize_fusion: true
  load_balancer:
    num_slots: 144
    layer_updates_per_iter: 0
