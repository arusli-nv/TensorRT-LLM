# dep32-final.yaml with 320 slots (two extra per GPU): the node-loss timeline of the FINAL COMPARISON. At 288 the 28
# survivors of a node have 28 extra slots for the node's 32 home experts, so FT admits single ranks only.
tensor_parallel_size: 32
moe_expert_parallel_size: 32
enable_attention_dp: true
enable_lm_head_tp_in_adp: false
gpus_per_node: 4
max_batch_size: 512
max_num_tokens: 8192
max_seq_len: 2304
attn_backend: TRTLLM
disable_overlap_scheduler: false
cuda_graph_config:
  enable_padding: true
  batch_sizes:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  - 128
  - 192
  - 256
  - 384
  - 512
kv_cache_config:
  dtype: fp8
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.7
moe_config:
  backend: CUTEDSL
  use_low_precision_moe_combine: true
  load_balancer:
    num_slots: 320
    layer_updates_per_iter: 1
stream_interval: 10
num_postprocess_workers: 4
print_iter_log: true
attention_dp_config:
  enable_balance: true
  batching_wait_iters: 0
  timeout_iters: 60
speculative_config:
  decoding_type: MTP
  num_nextn_predict_layers: 1
  max_draft_len: 1
