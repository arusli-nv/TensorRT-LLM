# Node-loss tests (item 3): dep32-b2-288.yaml with 320 EPLB slots (10 per GPU: 8 home experts + 2 copies of
# rank (r+16)%32's first two), enough to restore a whole node (s*(32-4) >= 256). The final static deployment runs it
# with ghost extra slots (the default with a static placement: not routed and unbacked while healthy).
