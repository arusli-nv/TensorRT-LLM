# Stress tests, pre-declared fallback (STRESS_LENGTHS=fallback; 2026-10-25 17:25 PT, before any stress data): input
# 128-2048 and output 64-1024 tokens. std-online.yaml with max_seq_len 3200 (2048 + 1024 + 1 draft = 3073 does not fit
# std-online's 2304), everything else identical.
tensor_parallel_size: 32
moe_expert_parallel_size: 32
enable_attention_dp: true
gpus_per_node: 4
max_batch_size: 512
max_num_tokens: 8192
max_seq_len: 3200
attn_backend: TRTLLM
attention_dp_config:
  enable_balance: true
  batching_wait_iters: 0
  timeout_iters: 60
cuda_graph_config:
  enable_padding: true
  max_batch_size: 512
kv_cache_config:
  dtype: fp8
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.8
speculative_config:
  decoding_type: MTP
  max_draft_len: 1
stream_interval: 10
num_postprocess_workers: 4
print_iter_log: true
moe_config:
  backend: CUTEDSL
  use_low_precision_moe_combine: true
  load_balancer:
    num_slots: 288
    layer_updates_per_iter: 1
