<svg xmlns="http://www.w3.org/2000/svg" width="900" height="114" font-family="Lato, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/><defs>
<marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2D3142"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker>
<marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#8C99A6"/></marker>
<marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C8372D"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F4F4F4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#D2D2D2" stroke-width="3"/></pattern></defs>
<rect x="20" y="12" width="250" height="90" rx="8" fill="#EAF4D6" stroke="#76B900" stroke-width="2"/>
<text x="145.0" y="39" font-size="22" fill="#2D3142" text-anchor="middle" font-weight="bold">Phase 1 (this talk)</text>
<text x="145.0" y="61" font-size="16" fill="#4F5D75" text-anchor="middle" font-weight="normal">Survive a loss</text>
<text x="145.0" y="80" font-size="16" fill="#4F5D75" text-anchor="middle" font-weight="normal">keep serving on N−k</text>
<rect x="315" y="12" width="250" height="90" rx="8" fill="white" stroke="#6B7A89" stroke-width="2"/>
<text x="440.0" y="39" font-size="22" fill="#2D3142" text-anchor="middle" font-weight="bold">Phase 2</text>
<text x="440.0" y="61" font-size="16" fill="#4F5D75" text-anchor="middle" font-weight="normal">Restore back to N</text>
<text x="440.0" y="80" font-size="16" fill="#4F5D75" text-anchor="middle" font-weight="normal">lost ranks rejoin</text>
<line x1="276" y1="57.0" x2="309" y2="57.0" stroke="#8C99A6" stroke-width="2.2" marker-end="url(#gray)"/>
<rect x="610" y="12" width="250" height="90" rx="8" fill="white" stroke="#6B7A89" stroke-width="2"/>
<text x="735.0" y="39" font-size="22" fill="#2D3142" text-anchor="middle" font-weight="bold">Phase 3</text>
<text x="735.0" y="61" font-size="16" fill="#4F5D75" text-anchor="middle" font-weight="normal">Planned scaling</text>
<text x="735.0" y="80" font-size="16" fill="#4F5D75" text-anchor="middle" font-weight="normal">grow or shrink, N ↔ M</text>
<line x1="571" y1="57.0" x2="604" y2="57.0" stroke="#8C99A6" stroke-width="2.2" marker-end="url(#gray)"/>
</svg>